# 순위를 주기적으로 받아 정적 사이트로 만들어 GitHub Pages에 올린다.
# 서버가 없으므로 수집 상태(순위와 스냅샷 이력)는 지난번 배포본에서 이어받는다(lib/build.js).
name: Collect and deploy

on:
  schedule:
    # 하루 두 번: 한국 시간 9시와 21시 무렵(cron은 UTC라서 0시·12시).
    # GitHub의 예약 실행은 매시 정각에 가장 붐벼 늦어지거나 건너뛸 수 있어 몇 분 비켜 둔다.
    # 시각을 바꾸면 config.js의 static.every와 static.at도 맞춘다.
    # 수집은 하루 두 번 이상, 한 시간에 한 번 이하로 한다(config.js의 collect). 예약 간격이 이 범위를 벗어나면 시험이 실패한다.
    - cron: '7 0,12 * * *'
  # 푸시와 수동 실행 때도 빌드해 화면을 새로 내지만, 받은 지 한 시간이 안 된 순위는 다시 받지 않는다(lib/build.js).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 것을 취소하지 않고 끝까지 둔다(중간에 끊기면 그 회차 수집이 버려진다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6

      - name: Test
        if: github.event_name != 'schedule'
        run: npm test

      - name: Collect rankings and build the site
        run: npm run build
        env:
          # 저장소 권한이 아니라 검색 API 한도(분당 30회)를 위해서만 쓴다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 없어도 된다(익명으로 받는다). 한도 초과가 잦으면 저장소 Secrets에 HF_TOKEN을 넣는다.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEED_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
