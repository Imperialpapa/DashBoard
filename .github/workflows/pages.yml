# 순위를 주기적으로 받아 정적 사이트로 만들어 GitHub Pages에 올린다.
# 서버가 없으므로 수집 상태(순위와 스냅샷 이력)는 지난번 배포본에서 이어받는다(lib/build.js).
name: Collect and deploy

on:
  schedule:
    # 하루 두 번: 한국 시간 9시와 21시 무렵(cron은 UTC라서 0시·12시).
    # GitHub의 예약 실행은 매시 정각에 가장 붐벼 늦어지거나 건너뛸 수 있어 몇 분 비켜 둔다.
    # 시각을 바꾸면 config.js의 static.every와 static.at도 맞춘다.
    # 수집은 하루 두 번 이상, 한 시간에 한 번 이하로 한다(config.js의 collect). 예약 간격이 이 범위를 벗어나면 시험이 실패한다.
    - cron: '7 0,12 * * *'
  # 푸시와 수동 실행 때도 빌드해 화면을 새로 내지만, 받은 지 한 시간이 안 된 순위는 다시 받지 않는다(lib/build.js).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 것을 취소하지 않고 끝까지 둔다(중간에 끊기면 그 회차 수집이 버려진다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6

      - name: Test
        if: github.event_name != 'schedule'
        run: npm test

      - name: Collect rankings and build the site
        run: npm run build
        env:
          # 저장소 권한이 아니라 검색 API 한도(분당 30회)를 위해서만 쓴다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 없어도 된다(익명으로 받는다). 한도 초과가 잦으면 저장소 Secrets에 HF_TOKEN을 넣는다.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEED_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # 올린 사이트 묶음이 목록에 보일 때까지 기다렸다가 배포한다.
      # 배포 단계(deploy-pages)는 이 실행의 묶음 목록에서 "github-pages"를 찾는데, 올린 직후에는 목록에 아직 안 보일 때가 있어
      # "No artifacts named github-pages were found"로 실패했다(2026-11-20, 잇달아 두 번).
      # 그래서 배포 단계가 묻는 것과 같은 목록을 2초마다 물어, 잇달아 두 번 하나로 보이면 넘어간다(길어야 2분).
      # 이 단계 때문에 배포가 막히지는 않게 한다: 목록을 묻지 못하면(GitHub 안쪽 주소가 바뀌는 등) 10초만 쉬고,
      # 2분이 지나도 안 보이면 그대로 배포를 시도한다.
      - name: Wait until the uploaded site is listed
        uses: actions/github-script@v9
        with:
          script: |
            const NAME = 'github-pages';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            // deploy-pages가 쓰는 것과 같은 조회(@actions/artifact의 listArtifacts): 이 실행에 올라온 묶음의 목록
            async function count() {
              const token = process.env.ACTIONS_RUNTIME_TOKEN;
              const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
              const scope = claims.scp.split(' ').find((s) => s.startsWith('Actions.Results:'));
              const [, workflowRunBackendId, workflowJobRunBackendId] = scope.split(':');
              const url = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', process.env.ACTIONS_RESULTS_URL);
              const res = await fetch(url, {
                method: 'POST',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body: JSON.stringify({ workflowRunBackendId, workflowJobRunBackendId }),
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return ((await res.json()).artifacts || []).filter((a) => a.name === NAME).length;
            }
            let seen = 0;
            let failed = 0;
            for (let i = 1; i <= 60; i += 1) {
              let n;
              try {
                n = await count();
              } catch (err) {
                failed += 1;
                if (failed >= 3) {
                  core.warning(`묶음 목록을 묻지 못했습니다(${err.message}). 10초 쉬고 배포로 넘어갑니다.`);
                  await sleep(10_000);
                  return;
                }
              }
              if (n > 1) {
                // 실패한 실행을 "Re-run"하면 앞 시도가 올린 묶음이 남아 둘이 되고, 배포 단계가 받아 주지 않는다.
                core.setFailed(`"${NAME}" 묶음이 이 실행에 ${n}개 있습니다. "Re-run" 대신 Actions 탭의 "Run workflow"로 새로 실행하세요.`);
                return;
              }
              seen = n === 1 ? seen + 1 : 0;
              if (seen >= 2) {
                core.info(`"${NAME}" 묶음이 목록에 보입니다(${i}번째 확인).`);
                return;
              }
              await sleep(2000);
            }
            core.warning(`2분을 기다려도 "${NAME}" 묶음이 목록에 보이지 않습니다. 그대로 배포를 시도합니다.`);

      - id: deploy
        uses: actions/deploy-pages@v5
